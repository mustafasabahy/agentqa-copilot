[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agentqa-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "jsonschema>=4.23,<5", "langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2", "langsmith>=0.4,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["agentqa*"]
[tool.setuptools.package-data]
agentqa = ["static/*", "resources/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
